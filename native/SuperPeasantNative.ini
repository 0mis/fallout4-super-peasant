; SuperPeasantNative.ini  ->  install to <Fallout 4>\Data\F4SE\Plugins\SuperPeasantNative.ini (optional; defaults = this file)
; Values are numbers only. Unknown keys are counted as "ignored" in the log line SPN|I|ini ... loaded.
; ReloadIni() (Papyrus) re-reads it in game; SetTunable("<path>", v) overrides one [Tabs] path at runtime.
; ---- HOTFIX (live1 session 0010: walls, interiors, target ping-pong, bloatfly damage, FPS). All optional; defaults shown.
; hotfix.warpRay = 1                  ; lift warps need free height above his chest (+ hotfix.warpHeadMargin 60 u); no put-back warp indoors
; hotfix.headroomProbe = 600          ; u, ray up from his chest each frame (headroom)
; hotfix.interiorCap = 1              ; indoors = interior cell or a ceiling closer than hotfix.lowCeiling (300 u)
; hotfix.indoorMaxSpeed = 1400        ; u/s indoors: mover command cap and sim centre-of-mass speed cap
; hotfix.simWalls = 1                 ; sim leash (torso behind geometry from his chest -> snapped back) + wall / ceiling velocity damping
; hotfix.leashMin = 40                ; u; hotfix.leashMargin = 30 u; hotfix.leashFollowSuspend = 2 s (native follow -> AI walk after a snap)
; hotfix.wallMinSpeed = 250           ; u/s; hotfix.wallLookahead = 0.05 s; hotfix.wallRadius = 30 u; hotfix.wallDamp = 1
; hotfix.stickTime = 1.2              ; s after an Engage: Release / switch held while the target is fair (hotfix.stickMaxDist 6000 u)
; hotfix.backstop = 1                 ; Papyrus got the hit but the victim lost no health after hotfix.backstopDelay (1.5 s): native TABS damage (Engage path only; the native brain always deals native damage)
; hotfix.reflingAge = 0.35            ; s: no re-fling of a victim in flight unless hotfix.reflingFactor (1.5) x faster
; hotfix.maxBodyWrites = 96           ; ragdoll body velocity writes per frame (all flings)
; hotfix.indoorLiftWarp = 0          ; 0: no lift warps at all indoors (kFlying needs none; they went through ceilings)
; hotfix.blockedDamp = 1              ; the proxy blocked (wall / enemy capsule): the sim also loses its velocity into it (no per-frame jitter)
; hotfix.sweptReach = 1               ; reach hits test the fist's path since last frame (no tunnelling at 80-100 u / frame)
; hotfix.sightFromCapsule = 1         ; native sight also from his capsule eye (feet + hotfix.eyeZ 100 u), not only the sim HEAD

[General]
Enabled = 1          ; 0 = plugin loads but installs no hooks
Mode = 0             ; start mode: 0 off (v1 Papyrus only), 1 flight + native punches, 2 + body render, 3 full body
LogLevel = 2

[Hooks]
InstallMask = 126    ; bit k = install Pk (2=P1 4=P2 8=P3 16=P4 32=P5 64=P6); 126 = all
PoseWriter = 16      ; round 6 step 14: 16 = P9, his pose written in the engine's own late 3D update (needs LookMask bit 1 + LookPassThrough 0; P1 = the fallback). 0 = auto as before step 14 (P1), 1 R1@P1, 2 R1@P2, 4 R1@P4, 8 R2
ProbeOrder = 1       ; log SPN|PROBE frame order lines
ProbeFrames = 300
StompTest = 0
LookMask = 31        ; round 6 step 14: + 1 (the late pose site: P9 with PoseWriter 16); step 6: + 2 (AI step veto) + 16 (relocation flag); step 5: 4 + 8 = the two engine knock hooks (knock-downs / paralysis of HIM become a wobble of his TABS body). Bits: 1 late pose, 2 ApplyMovementDelta, 4 knock site A, 8 paralyze site B, 16 SetPosition, 32 SetLifeState (optional life guard); 0 = none: knocks as in step 4 (no veto, no knock backstop: down -> up again); step 4 exactly also needs [Tabs] look.hitWobble 0, look.healthFloor 0, look.vmodClear 0
LookPassThrough = 0  ; round 6 step 5: 0 = the knock hooks act (look.knockVeto); 1 = every look hook only counts (step 2 probe pack)

[Body]
Upm = 64.18          ; game units per TABS metre
Size = 1.15          ; TABS size s
FlingScale = 1.0     ; multiplies every fling velocity (FO4 gravity 9.8 vs TABS 20: bodies fly ~2x farther)
ProxyMaxSpeed = 6000 ; u/s clamp on the proxy velocity command (TABS fight peak 88 m/s = 5650 u/s)
ProxySnapDist = 8    ; u: proxy short of the commanded move by more than this = it hit something

[Flight]
NativeMover = 1      ; 1: the plugin moves him every frame (Papyrus must not TranslateTo; it asks UseNativeMover())
                     ; 0: Papyrus TranslateTo as in v1 (SetNativeMover(bool) switches at runtime)
MoverPoint = 0       ; PROBE: 0 = controller writes at P6 (after his Actor::Update), 1 = in the P5 task
MoverMethod = 0      ; PROBE: 0 = AVF velocity (SetLinearVelocityImpl, swept: walls stop him), 1 = position warp
ControllerState = 4  ; hknpCharacterState written each frame: 2 = kInAir (AVF), 4 = kFlying (RUNNER2: it2c A/B, 4 holds, 2 falls back to kOnGround)
AvfFlags = 1         ; flags = (flags & ~0xFE00) | 0x8700 as AVF does
SendJumpLand = 1     ; animation event "jumpLand" when FLOAT touches down

[Punch]
AutoPunch = 1        ; the native TABS gate (7.4-7.8 swings/s, 50/50 fists, 0.2 s fist cooldown) punches the Engage() target
FlingOnHit = 1       ; the plugin flings the victim (KnockExplosion + ragdoll velocity 2721*sqrt(k/2) u/s)
HitEvents = 1        ; SuperPeasant:NativeEvents.OnSPNSwing / OnSPNHit / OnSPNLanded (+ F4SE external events SPN_*)
Reach = 1.25         ; PROBE: lumped fist reach, chest to chest, TABS metres at s = 1.15 (mode 1/2; mode 3 uses sim contacts)

[Brain]
Native = 1           ; BRAIN2 (round 2): the native L4D2 brain (target, sight, give-ups, movement, swings, damage, flings every frame) takes
                     ; over once the scripts call SetBrain(true) (API 6). KILL SWITCH: 0 = the Engage path of the hotfix build (Papyrus picks).

