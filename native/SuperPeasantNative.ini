brain.range = 1                      ; hunt range: 0 Near (local ring only = far-hunt KILL SWITCH), 1 Far (fights the group up to ~8192 u, hitters ~12288 u; ROUND3: first strike on seen hostiles up to 4096 u, busy ones 6144 u), 2 Anywhere (loaded area)
