; ---- CARRY: "Carry me" (fo4\work\carry\CARRY_SPEC.md; NATIVES). He picks the player up and flies them; the PLAYER steers. ----
; Start / stop: his menu ("Carry me" / "Put me down"), the hotkey (keyboard G), or both sticks clicked together (Sprint + Sneak user events).
; Steering reads the engine's user events (Forward/Back/StrafeLeft/StrafeRight, Move = left stick, Jump, Sneak, Sprint), so remaps and pads work.
; While carried: fly where you look (look up = climb), Jump = up, Sneak = down (tap = keep descending), Sprint = a TABS dash (hold / pad L3 tap = a chain).
; Every value below is the code default (commented out); numbers only.
; carry.enabled = 1                   ; master switch (0: the hooks P7-P9 are not installed, natives refuse)
; carry.hooks = 7                     ; 1 = P7 (PlayerCharacter::Update: the player's controller), 2 = P8 (plan A walk filter), 4 = P9 (the player's arms); separate from [Hooks] InstallMask
; carry.inputMode = 0                 ; 0 = plan B (Papyrus disables movement, the raw disabled events steer), 1 = plan A (movement stays on, P8 zeroes the walk)
; carry.inputPath = 0                 ; 0 auto (MenuControls observer; the PlayerControls pre-scan takes over if MenuControls sees no game input), 1 MenuControls, 2 pre-scan
; carry.lookSource = 0                ; 0 = camera root axis (carry.camAxis: 0 +X 1 +Y 2 +Z 3..5 negative; auto-calibrated in 1st person), 1 = the player's angles (carry.pitchSign)
; carry.camAxis = 1
; carry.pitchSign = 1
; carry.requirePapyrus = 1            ; the hotkey / chord / resume need Papyrus SetCarryReady (new scripts)
; carry.layerMask = 31                ; what Papyrus disables while carried: 1 move 2 jump 4 sneak 8 sprint 16 fast travel (30 with inputMode 1)
; carry.hotkeyKb = 71                 ; keyboard VK code (71 = G; 0 = off). V (86) is TogglePOV and Q is VATS in vanilla
; carry.hotkeyMod = 0                 ; VK that must be held too (160 LShift, 162 LCtrl, 164 LAlt; 0 = none)
; carry.chord = 1                     ; Sprint + Sneak pressed within carry.chordWindow (0.25 s) toggles (pad: L3 + R3); carry.chordHeld = 1: the first must still be held
; carry.toggleDebounce = 0.5          ; s between two toggles
; carry.holdT = 0.3                   ; tap < holdT <= hold (Sneak tap = descend-mode, pad Sprint tap = boost-mode)
; carry.padSprintToggle = 1
; carry.mover = 3                     ; 3 C (swept warp, the default: in game A and B realised 0), 0 auto (CARRY-v2: starts at C too), 1 A (P7), 2 B (pump velocity); a lift that does not rise carry.liftWatchDz (20 u) in carry.liftWatchT (0.25 s) switches the carry to C
; carry.pickSkipLayers = 113455887650816 ; collision layers the carry picks see through (phantoms: 12 trigger, 15, 16, 21, 22 actor zone = tree canopies, 23, 24, 36, 37, 40-42, 45, 46); 0 = every layer
