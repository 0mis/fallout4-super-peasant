; ---- BOOKMARK ("that was weird", round 6): saw him do something odd? Press F8 (keyboard) or View + Y together (controller). ----
; He keeps the last 10 s of what he was doing in memory (his target and why, the foes around and why each one is or is not his target,
; how he moves and where he is stuck, every swing, hit and refusal, the carry, fps and his cost). The key writes it to
; Documents\My Games\Fallout4\F4SE\SuperPeasant_Bookmarks\bookmark_<date>_<time>.log (next to SuperPeasantNative.log) and the game
; shows "Super Peasant: moment saved". Send us that file (or just tell us the time). Free while you do not press it; one file is ~1 MB.
bookmark.on = 1                      ; 0 = off (no recording, the key does nothing)
bookmark.key = 119                   ; keyboard key, a Windows VK code: 119 = F8 (unused by Fallout 4). 118 F7, 117 F6, 121 F10; 0 = no keyboard key. Not 71 (G: "Carry me")
bookmark.keyMod = 0                  ; a key that must be held too (160 LShift, 162 LCtrl, 164 LAlt); 0 = none
bookmark.pad = 32800                 ; controller buttons pressed together (XInput bits, added): 32 View/Back + 32768 Y = 32800. 16 Start, 64 LS, 128 RS, 256 LB, 512 RB, 4096 A, 8192 B, 16384 X; 0 = off
bookmark.padWindow = 0.5             ; s: the controller buttons count as "together" when the last one is pressed within this time of the first
bookmark.seconds = 10                ; s kept before the press (2..30)
bookmark.debounce = 2                ; s: at most one bookmark per this time (a double press makes one file)
bookmark.notify = 1                  ; 0 = no "Super Peasant: moment saved" message (the file is still written)
; ---- ROUND 6 STEP 2: five engine fixes the Fallout 4 research found + the black box (nothing he does looks different) ----
; Melee hits on you are also read from the hit's own data when the game leaves the event empty (he saw those raiders before too; this closes the gap). His sight and wall rays
; use the game's own collision layers (no fake walls from trap triggers), a ray the game skipped for time counts as blocked (never "clear"),
; a load hitch at full speed is no longer mistaken for a teleport, and nothing ticks while the game world is frozen. A black box keeps his last
; ~30 s of decisions; if you die it is saved next to SuperPeasantNative.log (SuperPeasantNative.bb<N>, the last 5) so the moment can be replayed.
look.hitSinkHitData = 1              ; (0) a hit on you / him / a teammate whose event has no target / attacker is read from the hit's own data (DoHitMe events; in play another sink usually fills them first)
look.rayLayers = 0                   ; (0) his rays carry his collision filter + per-use layer masks (sight / walls / floor), trigger volumes never block. Built and proven in game (1 pick per ray) but OFF: indoor reach (R3_HOUSE) had a slow tail with it on; steps 7 / 8 re-tune it
look.pickFailedIsHit = 1             ; (0) a ray the game refused (its pick time was used up) is blocked; his Wings / sweep rays are never refused
